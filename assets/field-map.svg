<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="ASC Field Map">
  <defs>
    <radialGradient id="void" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#121a2a"/>
      <stop offset="55%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e0a86a" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1100" height="520" fill="url(#void)"/>

  <!-- star dust -->
  <g fill="#94a3b8" opacity="0.35">
    <circle cx="80" cy="60" r="1.2"/><circle cx="160" cy="120" r="0.9"/><circle cx="240" cy="40" r="1.1"/>
    <circle cx="980" cy="80" r="1"/><circle cx="1040" cy="160" r="1.3"/><circle cx="900" cy="40" r="0.8"/>
    <circle cx="60" cy="400" r="1"/><circle cx="140" cy="470" r="1.2"/><circle cx="1020" cy="450" r="1"/>
    <circle cx="700" cy="500" r="0.9"/><circle cx="420" cy="30" r="1"/><circle cx="860" cy="490" r="1.1"/>
  </g>

  <!-- orbital rings -->
  <g fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.7">
    <ellipse cx="550" cy="270" rx="120" ry="70"/>
    <ellipse cx="550" cy="270" rx="220" ry="125"/>
    <ellipse cx="550" cy="270" rx="340" ry="190"/>
    <ellipse cx="550" cy="270" rx="450" ry="230" opacity="0.5"/>
  </g>

  <!-- rotating sweep -->
  <g transform="translate(550 270)">
    <path d="M0,0 L450,0" stroke="#5eead4" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 L450,0" stroke="#e0a86a" stroke-width="8" opacity="0.08" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- connection lines (static mesh) -->
  <g stroke="#5eead4" stroke-opacity="0.28" stroke-width="1.2" fill="none">
    <line x1="550" y1="270" x2="250" y2="160"/>
    <line x1="550" y1="270" x2="180" y2="310"/>
    <line x1="550" y1="270" x2="320" y2="420"/>
    <line x1="550" y1="270" x2="780" y2="140"/>
    <line x1="550" y1="270" x2="900" y2="250"/>
    <line x1="550" y1="270" x2="820" y2="400"/>
    <line x1="550" y1="270" x2="560" y2="80"/>
  </g>

  <!-- traveling packets on lines -->
  <circle r="3.5" fill="#e0a86a">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M550,270 L250,160"/>
  </circle>
  <circle r="3.5" fill="#5eead4">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M550,270 L900,250"/>
  </circle>
  <circle r="3" fill="#e0a86a">
    <animateMotion dur="4.1s" repeatCount="indefinite" path="M550,270 L320,420"/>
  </circle>
  <circle r="3" fill="#5eead4">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M550,270 L780,140"/>
  </circle>

  <!-- header chrome -->
  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#5eead4" letter-spacing="3">ASC://FIELD</text>
  <text x="170" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b">CLASSIFIED ENGINEER MAP</text>
  <text x="1060" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e0a86a">SIGNAL LOCKED</text>
  <circle cx="980" cy="32" r="4" fill="#5eead4">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- center core -->
  <circle cx="550" cy="270" r="46" fill="#0b1220" stroke="#e0a86a" stroke-width="2"/>
  <circle cx="550" cy="270" r="46" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="46;58;46" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="550" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#5eead4">CORE</text>
  <text x="550" y="284" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#f8fafc">ALLEN</text>

  <!-- nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
    <!-- DevMind -->
    <circle cx="250" cy="160" r="10" fill="#0b1220" stroke="#5eead4" stroke-width="2">
      <animate attributeName="r" values="10;12;10" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="250" y="140" text-anchor="middle" fill="#f8fafc">DevMind</text>
    <text x="250" y="188" text-anchor="middle" fill="#64748b">LIVE</text>

    <!-- Agent -->
    <circle cx="180" cy="310" r="9" fill="#0b1220" stroke="#e0a86a" stroke-width="2"/>
    <text x="180" y="290" text-anchor="middle" fill="#f8fafc">Agent</text>
    <text x="180" y="336" text-anchor="middle" fill="#64748b">REASON</text>

    <!-- CA SaaS -->
    <circle cx="320" cy="420" r="9" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <text x="320" y="400" text-anchor="middle" fill="#f8fafc">CA SaaS</text>
    <text x="320" y="446" text-anchor="middle" fill="#64748b">B2B</text>

    <!-- Vertex -->
    <circle cx="780" cy="140" r="9" fill="#0b1220" stroke="#e0a86a" stroke-width="2"/>
    <text x="780" y="120" text-anchor="middle" fill="#f8fafc">Vertex</text>
    <text x="780" y="168" text-anchor="middle" fill="#64748b">API</text>

    <!-- Patent -->
    <circle cx="900" cy="250" r="11" fill="#0b1220" stroke="#e0a86a" stroke-width="2">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="900" y="228" text-anchor="middle" fill="#f8fafc">Patent</text>
    <text x="900" y="278" text-anchor="middle" fill="#64748b">450815-001</text>

    <!-- ML/DL -->
    <circle cx="820" cy="400" r="9" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <text x="820" y="380" text-anchor="middle" fill="#f8fafc">ML / DL</text>
    <text x="820" y="426" text-anchor="middle" fill="#64748b">LAB</text>

    <!-- Portfolio -->
    <circle cx="560" cy="80" r="9" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <text x="560" y="60" text-anchor="middle" fill="#f8fafc">Portfolio</text>
    <text x="560" y="108" text-anchor="middle" fill="#64748b">CINEMA</text>
  </g>

  <text x="40" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b">ORIGIN: Gujarat, India</text>
  <text x="1060" y="500" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b">TARGET: Machine Learning Engineer</text>
</svg>
