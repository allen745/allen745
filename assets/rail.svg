<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="24" viewBox="0 0 1100 24" role="img" aria-label="Section rail">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8eb8c4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4b48a"/>
      <stop offset="100%" stop-color="#7ec8b8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="40" y1="12" x2="1060" y2="12" stroke="#2a3344" stroke-width="2"/>
  <rect x="-160" y="8" width="160" height="8" rx="4" fill="url(#pulse)">
    <animate attributeName="x" values="-160;1100" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="550" cy="12" r="3.5" fill="#d4b48a">
    <animate attributeName="r" values="2.5;5;2.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
